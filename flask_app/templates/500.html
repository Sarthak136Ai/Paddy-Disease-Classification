{% extends "base.html" %}

{% block title %}Internal Server Error (500) | Paddy Leaf AI{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 5rem 2rem; max-width: 600px; margin: 3rem auto;">
    <div style="font-size: 4rem; color: var(--accent-red); margin-bottom: 1rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size: 2.25rem; margin-bottom: 0.5rem;">500 - Server Error</h1>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
        An unexpected error occurred during processing.
        {% if error %}<br><small style="color: var(--text-muted);">{{ error }}</small>{% endif %}
    </p>
    <a href="/" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
